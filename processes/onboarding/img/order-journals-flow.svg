<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 950" width="1600" height="950" role="img" aria-labelledby="title desc">
  <title id="title">Рух наказу між журналами відділів</title>
  <desc id="desc">Оцифрована рукописна схема. Фахівець К1 відділу кадрів веде журнали К1-1 «Накази в проєкті» і К1-2 «Накази в роботі». Проєкт іде в журнал П-1 планового відділу, повертається на доопрацювання або затвердженим. Затверджений наказ іде в журнал Р-1 розрахункового відділу, який повертає питання на доопрацювання або відмітку «проведено». Тверда копія наказу йде на підпис, підписана копія — фахівцю К2 (журнали К2-1, К2-2) і далі в архів паперових наказів.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <style>
      text { font-family: 'Segoe UI', Roboto, Arial, sans-serif; fill: #0f172a; }
      .h1 { font-size: 24px; font-weight: 700; }
      .sub { font-size: 13.5px; fill: #475569; }
      .dept { text-anchor: middle; font-size: 16px; font-weight: 700; }
      .who { text-anchor: middle; font-size: 13px; fill: #334155; }
      .jr { text-anchor: middle; font-size: 13px; font-weight: 700; fill: #475569; }
      .in { text-anchor: middle; font-size: 14px; font-weight: 700; }
      .lbl { text-anchor: middle; font-size: 13px; }
      .lbl-s { text-anchor: middle; font-size: 12px; fill: #475569; }
      .note { text-anchor: middle; font-size: 12.5px; fill: #475569; font-style: italic; }
      .m { font-size: 12px; }
      .box { stroke-width: 1.6; }
      .hr { fill: #dbeafe; stroke: #1d4ed8; }
      .rv { fill: #dcfce7; stroke: #15803d; }
      .pl { fill: #ede9fe; stroke: #6d28d9; }
      .nt { fill: #f8fafc; stroke: #94a3b8; stroke-dasharray: 5 4; }
      .flow { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#a); }
      .aux { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .aux-a { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 6 4; marker-end: url(#ag); }
    </style>
  </defs>

  <rect width="1600" height="950" fill="#ffffff"/>

  <!-- Заголовок -->
  <text x="40" y="38" class="h1">Рух наказу між журналами відділів</text>
  <text x="40" y="62" class="sub">Оцифровано з рукописної схеми. Прямокутник — журнал наказів, стрілка — передача наказу з його станом, пунктир — маршрут усередині журналу або зв'язок із ним.</text>

  <!-- Відділ кадрів: фахівець К1 -->
  <text x="900" y="104" class="dept">Відділ кадрів</text>
  <text x="900" y="124" class="who">фахівець К1</text>
  <text x="900" y="156" class="jr">журнал К1-1</text>
  <rect x="760" y="164" width="280" height="72" rx="8" class="box hr"/>
  <text x="900" y="206" class="in">Накази в проєкті</text>

  <text x="900" y="270" class="jr">журнал К1-2</text>
  <rect x="760" y="278" width="280" height="362" rx="8" class="box hr"/>
  <text x="900" y="304" class="in">Накази в роботі</text>

  <!-- Розрахунковий відділ -->
  <text x="325" y="240" class="dept">Розрахунковий відділ</text>
  <text x="325" y="270" class="jr">журнал Р-1</text>
  <rect x="230" y="278" width="190" height="362" rx="8" class="box rv"/>

  <!-- Плановий відділ -->
  <text x="1435" y="124" class="dept">Плановий відділ</text>
  <text x="1435" y="156" class="jr">журнал П-1</text>
  <rect x="1340" y="164" width="190" height="476" rx="8" class="box pl"/>
  <text x="1435" y="190" class="in">Накази в роботі</text>

  <!-- К1-1 → П-1 -->
  <text x="1190" y="174" class="lbl-s">створення резервної копії наказу</text>
  <text x="1190" y="190" class="lbl-s">(журнал резервних копій)</text>
  <text x="1190" y="210" class="lbl">проєкт</text>
  <path d="M1040,218 L1338,218" class="flow"/>

  <!-- К1-2 ↔ П-1 -->
  <text x="1190" y="342" class="lbl">проєкт на доопрацювання</text>
  <path d="M1340,350 L1042,350" class="flow"/>
  <text x="1190" y="422" class="lbl">проєкт доопрацьований</text>
  <path d="M1040,430 L1338,430" class="flow"/>
  <text x="1190" y="502" class="lbl">затверджений</text>
  <path d="M1340,510 L1042,510" class="flow"/>
  <text x="1190" y="576" class="lbl">до планового відділу:</text>
  <text x="1190" y="594" class="lbl">питання від розрахункового відділу</text>
  <path d="M1040,602 L1338,602" class="flow"/>

  <!-- К1-2 ↔ Р-1 -->
  <text x="590" y="342" class="lbl">затверджений</text>
  <path d="M760,350 L422,350" class="flow"/>
  <text x="590" y="404" class="lbl">затверджений,</text>
  <text x="590" y="422" class="lbl">питання на доопрацювання</text>
  <path d="M420,430 L758,430" class="flow"/>
  <text x="590" y="494" class="lbl">затверджений</text>
  <text x="590" y="512" class="lbl">доопрацьований</text>
  <path d="M760,520 L422,520" class="flow"/>
  <text x="590" y="592" class="lbl">проведено</text>
  <path d="M420,600 L758,600" class="flow"/>

  <!-- Маршрут питання розрахункового відділу всередині К1-2 -->
  <path d="M762,430 C860,436 930,590 1036,600" class="aux-a"/>
  <text x="905" y="488" class="note">до планового відділу</text>

  <!-- Архів і тверді копії -->
  <path d="M790,640 L790,690" class="aux"/>
  <text x="500" y="682" class="lbl">в архів журналу наказів (журнал-архів)</text>
  <path d="M790,690 L219,690" class="flow"/>

  <path d="M830,640 L830,750" class="aux"/>
  <text x="500" y="742" class="lbl">тверда копія затвердженого або проведеного наказу</text>
  <path d="M830,750 L219,750" class="flow"/>
  <text x="500" y="768" class="lbl">на підпис</text>

  <text x="488" y="812" class="lbl">тверда копія наказу з підписом</text>
  <path d="M217,820 L758,820" class="flow"/>

  <!-- Відділ кадрів: фахівець К2 -->
  <path d="M960,640 L960,788" class="aux-a"/>
  <rect x="760" y="790" width="280" height="60" rx="8" class="box hr"/>
  <text x="900" y="815" class="in" style="font-size:13.5px">Відділ кадрів · фахівець К2</text>
  <text x="900" y="836" class="who">журнали К2-1, К2-2</text>

  <text x="1190" y="812" class="lbl">в архів паперових наказів</text>
  <path d="M1040,820 L1330,820" class="flow"/>

  <!-- Відкриті питання з рукопису -->
  <rect x="40" y="664" width="177" height="176" rx="8" class="box nt"/>
  <text x="128" y="740" class="note">Ідентифікація</text>
  <text x="128" y="757" class="note">фахівця</text>
  <text x="128" y="774" class="note">відділу кадрів?</text>
  <rect x="1340" y="660" width="190" height="76" rx="8" class="box nt"/>
  <text x="1435" y="685" class="note">Ідентифікація</text>
  <text x="1435" y="702" class="note">фахівця</text>
  <text x="1435" y="719" class="note">відділу кадрів?</text>

  <!-- Легенда -->
  <rect x="40" y="868" width="1520" height="62" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="60" y="884" width="20" height="14" rx="3" class="box hr"/><text x="88" y="896" class="m">Відділ кадрів</text>
  <rect x="210" y="884" width="20" height="14" rx="3" class="box pl"/><text x="238" y="896" class="m">Плановий відділ</text>
  <rect x="380" y="884" width="20" height="14" rx="3" class="box rv"/><text x="408" y="896" class="m">Розрахунковий відділ</text>
  <rect x="580" y="884" width="20" height="14" rx="3" class="box nt"/><text x="608" y="896" class="m">відкрите питання з рукопису</text>
  <path d="M60,916 L108,916" class="flow"/><text x="118" y="920" class="m">передача наказу; підпис над стрілкою — стан наказу</text>
  <path d="M520,916 L568,916" class="aux"/><text x="578" y="920" class="m">маршрут усередині журналу або зв'язок із журналом</text>
  <text x="1540" y="920" class="m" style="text-anchor:end; fill:#64748b">Джерело: рукописна схема (фото), оцифровано 26.10.2026</text>
</svg>
