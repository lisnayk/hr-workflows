<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 880" width="1600" height="880" role="img" aria-labelledby="title desc">
  <title id="title">Цільовий маршрут наказу по журналах</title>
  <desc id="desc">Цільовий варіант: журнал означає, чия зараз черга діяти. Статуси ISpro не змінюються вручну — Проект, Затверджений, Проведений ідуть своїм ходом, етап показує журнал. Журнали: 1 Проєкти (ВК, фахівець К1), 2 Погодження ПВ (плановий відділ), 3 Погодження РВ (розрахунковий відділ), 4 Підписання і реєстрація (ВК, фахівець К1), 5 Проведені (розрахунковий відділ), 6 Чинні накази — повністю затверджені накази з паперовим примірником, які не можна скасувати (ВК, фахівець К2), 7 Архів — журнал, у який накази переходять через встановлений строк (ВК, фахівець К2). На кроках 2–5 наказ можна повернути в журнал 1 (статус «Проект»); із журналів 4–5 після затвердження — через «Відкликати» (Alt+R), у журналі 5 — до блокування Ctrl+L.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
    <style>
      text { font-family: 'Segoe UI', Roboto, Arial, sans-serif; fill: #0f172a; }
      .h1 { font-size: 24px; font-weight: 700; }
      .sub { font-size: 13.5px; fill: #475569; }
      .name { font-size: 16px; font-weight: 700; }
      .own { font-size: 13px; font-weight: 600; }
      .li { font-size: 12.5px; }
      .rt { font-size: 11.5px; fill: #64748b; }
      .tl { text-anchor: middle; font-size: 12px; fill: #334155; }
      .ol { text-anchor: middle; font-size: 12px; fill: #c2410c; }
      .pill { text-anchor: middle; font-size: 11px; font-weight: 700; }
      .num { text-anchor: middle; font-size: 13px; font-weight: 700; fill: #ffffff; }
      .m { font-size: 12px; }
      .box { stroke-width: 1.6; }
      .hr { fill: #eff6ff; stroke: #1d4ed8; }
      .pl { fill: #f5f3ff; stroke: #6d28d9; }
      .rv { fill: #f0fdf4; stroke: #15803d; }
      .st { fill: #f8fafc; stroke: #94a3b8; stroke-dasharray: 5 4; }
      .flow { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#a); }
      .back { fill: none; stroke: #c2410c; stroke-width: 1.8; stroke-dasharray: 6 4; marker-end: url(#ao); }
      .div { stroke: #cbd5e1; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1600" height="880" fill="#ffffff"/>

  <!-- Заголовок -->
  <text x="60" y="38" class="h1">Цільовий маршрут наказу по журналах</text>
  <text x="60" y="62" class="sub">Журнал = чия зараз черга: наказ лежить у журналі того, хто має діяти. Статуси ISpro не змінюємо вручну — вони йдуть своїм ходом, етап показує журнал. Опис кроків — ispro-order-route-order.md.</text>

  <!-- Зона повернення: кроки 2–5 -->
  <polygon points="450,142 1495,142 1495,775 1185,775 1185,415 450,415" fill="#fff7ed" fill-opacity="0.55" stroke="#c2410c" stroke-width="1.6" stroke-dasharray="8 5"/>
  <text x="462" y="134" class="ol" style="text-anchor:start; font-weight:700">Зона повернення: на кроках 2–5 наказ можна повернути в журнал 1 — статус знову «Проект», причина у вкладенні</text>

  <!-- 1 · Проєкти -->
  <rect x="90" y="160" width="280" height="240" rx="10" class="box hr"/>
  <circle cx="114" cy="188" r="13" fill="#1d4ed8"/><text x="114" y="193" class="num">1</text>
  <text x="134" y="194" class="name">Проєкти</text>
  <text x="104" y="222" class="own" style="fill:#1d4ed8">ВК · фахівець К1</text>
  <rect x="290" y="208" width="68" height="20" rx="10" fill="#bfdbfe"/><text x="324" y="222" class="pill" style="fill:#1e3a8a">Проект</text>
  <line x1="104" y1="236" x2="356" y2="236" class="div"/>
  <text class="li"><tspan x="104" y="258">• створення проєкту наказу</tspan><tspan x="104" y="278">• доопрацювання після повернення</tspan><tspan x="104" y="298">• виконавець і строк — «Контроль</tspan><tspan x="114" y="316">виконання наказу» (Alt+S)</tspan></text>
  <text x="104" y="384" class="rt">права: створення, коригування</text>

  <!-- 2 · Погодження ПВ -->
  <rect x="460" y="160" width="280" height="240" rx="10" class="box pl"/>
  <circle cx="484" cy="188" r="13" fill="#6d28d9"/><text x="484" y="193" class="num">2</text>
  <text x="504" y="194" class="name">Погодження ПВ</text>
  <text x="474" y="222" class="own" style="fill:#6d28d9">Плановий відділ</text>
  <rect x="660" y="208" width="68" height="20" rx="10" fill="#bfdbfe"/><text x="694" y="222" class="pill" style="fill:#1e3a8a">Проект</text>
  <line x1="474" y1="236" x2="726" y2="236" class="div"/>
  <text class="li"><tspan x="474" y="258">• віза: штатний розпис, фонди</tspan><tspan x="474" y="278">• погоджено → журнал 3</tspan><tspan x="474" y="298">• зауваження → повернення в 1</tspan></text>
  <text x="474" y="384" class="rt">права: перегляд, перенесення *</text>

  <!-- 3 · Погодження РВ -->
  <rect x="830" y="160" width="280" height="240" rx="10" class="box rv"/>
  <circle cx="854" cy="188" r="13" fill="#15803d"/><text x="854" y="193" class="num">3</text>
  <text x="874" y="194" class="name">Погодження РВ</text>
  <text x="844" y="222" class="own" style="fill:#15803d">Розрахунковий відділ</text>
  <rect x="1030" y="208" width="68" height="20" rx="10" fill="#bfdbfe"/><text x="1064" y="222" class="pill" style="fill:#1e3a8a">Проект</text>
  <line x1="844" y1="236" x2="1096" y2="236" class="div"/>
  <text class="li"><tspan x="844" y="258">• віза: надбавки, фонди, ЗП</tspan><tspan x="844" y="278">• погоджено → журнал 4</tspan><tspan x="844" y="298">• зауваження → повернення в 1</tspan></text>
  <text x="844" y="384" class="rt">права: перегляд, перенесення *</text>

  <!-- 4 · Підписання і реєстрація -->
  <rect x="1200" y="160" width="280" height="240" rx="10" class="box hr"/>
  <circle cx="1224" cy="188" r="13" fill="#1d4ed8"/><text x="1224" y="193" class="num">4</text>
  <text x="1244" y="194" class="name">Підписання і реєстрація</text>
  <text x="1214" y="222" class="own" style="fill:#1d4ed8">ВК · фахівець К1</text>
  <rect x="1372" y="208" width="96" height="20" rx="10" fill="#60a5fa"/><text x="1420" y="222" class="pill" style="fill:#ffffff">Затверджений</text>
  <line x1="1214" y1="236" x2="1466" y2="236" class="div"/>
  <text class="li"><tspan x="1214" y="258">• підпис: тверда копія або КЕП</tspan><tspan x="1224" y="276">(ректор або уповноважена особа)</tspan><tspan x="1214" y="296">• не підписано → повернення в 1</tspan><tspan x="1214" y="316">• Затвердити (Alt+F5): номер</tspan><tspan x="1224" y="334">і дата в день підпису</tspan><tspan x="1214" y="354">• Провести (Alt+P)</tspan><tspan x="1214" y="374">• ДПС — до першого робочого дня</tspan></text>
  <text x="1214" y="393" class="rt">права: перенесення, реєстрація, проведення</text>

  <!-- 5 · Проведені -->
  <rect x="1200" y="540" width="280" height="220" rx="10" class="box rv"/>
  <circle cx="1224" cy="568" r="13" fill="#15803d"/><text x="1224" y="573" class="num">5</text>
  <text x="1244" y="574" class="name">Проведені</text>
  <text x="1214" y="602" class="own" style="fill:#15803d">Розрахунковий відділ</text>
  <rect x="1380" y="588" width="88" height="20" rx="10" fill="#2563eb"/><text x="1424" y="602" class="pill" style="fill:#ffffff">Проведений</text>
  <line x1="1214" y1="616" x2="1466" y2="616" class="div"/>
  <text class="li"><tspan x="1214" y="638">• підтвердження наказів</tspan><tspan x="1224" y="656">відділом зарплати (Alt+Н)</tspan><tspan x="1214" y="676">• перевірка особового рахунку</tspan><tspan x="1214" y="696">• Ctrl+L — блокування відкликання</tspan><tspan x="1214" y="716">• до Ctrl+L: Відкликати (Alt+R)</tspan></text>
  <text x="1214" y="746" class="rt">дії — в Обліку праці й ЗП</text>

  <!-- 6 · Чинні накази -->
  <rect x="830" y="540" width="280" height="220" rx="10" class="box hr"/>
  <circle cx="854" cy="568" r="13" fill="#1d4ed8"/><text x="854" y="573" class="num">6</text>
  <text x="874" y="574" class="name">Чинні накази</text>
  <text x="844" y="602" class="own" style="fill:#1d4ed8">ВК · фахівець К2</text>
  <rect x="1010" y="588" width="88" height="20" rx="10" fill="#2563eb"/><text x="1054" y="602" class="pill" style="fill:#ffffff">Проведений</text>
  <line x1="844" y1="616" x2="1096" y2="616" class="div"/>
  <text class="li"><tspan x="844" y="638">• повністю затверджені й проведені</tspan><tspan x="844" y="656">• є паперовий примірник з підписом</tspan><tspan x="844" y="676">• скасувати не можна (Ctrl+L),</tspan><tspan x="854" y="694">зміни — лише новим наказом</tspan><tspan x="844" y="714">• ознайомлення працівника під</tspan><tspan x="854" y="732">підпис (ст. 29 КЗпП)</tspan></text>
  <text x="844" y="752" class="rt">права: перегляд, перенесення *</text>

  <!-- 7 · Архів -->
  <rect x="460" y="540" width="280" height="220" rx="10" class="box hr"/>
  <circle cx="484" cy="568" r="13" fill="#1d4ed8"/><text x="484" y="573" class="num">7</text>
  <text x="504" y="574" class="name">Архів</text>
  <text x="474" y="602" class="own" style="fill:#1d4ed8">ВК · фахівець К2</text>
  <rect x="640" y="588" width="88" height="20" rx="10" fill="#2563eb"/><text x="684" y="602" class="pill" style="fill:#ffffff">Проведений</text>
  <line x1="474" y1="616" x2="726" y2="616" class="div"/>
  <text class="li"><tspan x="474" y="638">• накази переходять сюди з</tspan><tspan x="484" y="656">журналу 6 через встановлений строк</tspan><tspan x="474" y="676">• паперові примірники — в архів</tspan><tspan x="484" y="694">паперових наказів</tspan><tspan x="474" y="714">• історія руху — «Протокол змін</tspan><tspan x="484" y="732">запису» (Shift+F10)</tspan></text>
  <text x="474" y="752" class="rt">права: перегляд</text>

  <!-- Рух вперед -->
  <path d="M370,280 L458,280" class="flow"/><text x="415" y="268" class="tl">на візу</text>
  <path d="M740,280 L828,280" class="flow"/><text x="785" y="268" class="tl">погоджено</text>
  <path d="M1110,280 L1198,280" class="flow"/><text x="1155" y="268" class="tl">погоджено</text>
  <path d="M1340,400 L1340,538" class="flow"/><text x="1352" y="462" class="tl" style="text-anchor:start">зареєстровано,</text><text x="1352" y="478" class="tl" style="text-anchor:start">проведено</text>
  <path d="M1200,650 L1112,650" class="flow"/><text x="1155" y="638" class="tl">підтверджено</text><text x="1155" y="668" class="tl">Ctrl+L</text>
  <path d="M830,650 L742,650" class="flow"/><text x="785" y="638" class="tl">через строк</text>

  <!-- Повернення -->
  <path d="M450,215 L372,215" class="back"/>
  <text x="411" y="206" class="ol">в проєкт</text>

  <!-- Легенда -->
  <rect x="60" y="796" width="1480" height="70" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="80" y="812" width="20" height="14" rx="3" class="box hr"/><text x="108" y="824" class="m">Відділ кадрів</text>
  <rect x="230" y="812" width="20" height="14" rx="3" class="box pl"/><text x="258" y="824" class="m">Плановий відділ</text>
  <rect x="400" y="812" width="20" height="14" rx="3" class="box rv"/><text x="428" y="824" class="m">Розрахунковий відділ</text>
  <rect x="600" y="812" width="40" height="14" rx="7" fill="#bfdbfe"/><text x="648" y="824" class="m">статус наказу в ISpro (змінюється сам: Затвердити, Провести)</text>
  <path d="M80,850 L128,850" class="flow"/><text x="138" y="854" class="m">перенесення в наступний журнал</text>
  <path d="M380,850 L428,850" class="back"/><text x="438" y="854" class="m">повернення в проєкт (журнал 1)</text>
  <rect x="660" y="844" width="20" height="14" rx="3" fill="#fff7ed" stroke="#c2410c" stroke-dasharray="4 3"/><text x="688" y="854" class="m">зона повернення (кроки 2–5)</text>
  <text x="900" y="854" class="m">* спосіб перенесення наказу між журналами треба перевірити на інсталяції</text>
</svg>
