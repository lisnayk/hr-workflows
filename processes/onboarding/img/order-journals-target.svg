<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 962" width="1600" height="962" role="img" aria-labelledby="title desc">
  <title id="title">Цільовий маршрут наказу по журналах</title>
  <desc id="desc">Цільовий варіант: журнал означає, чия зараз черга діяти. Статуси ISpro не змінюються вручну — Проект, Затверджений, Проведений ідуть своїм ходом, етап показує журнал. Журнали: 1 Проєкти (ВК, фахівець К1), 2 Погодження ПВ (плановий відділ), 3 Погодження РВ (розрахунковий відділ), 4 На підписі (ВК), 5 Реєстрація (ВК, фахівець К2), 6 Проведені (розрахунковий відділ), 7 Чинні накази — повністю затверджені накази з паперовим примірником, які не можна скасувати (ВК, фахівець К2), 8 Архів — журнал, у який накази переходять через встановлений строк (ВК, фахівець К2). Журнали 4 і 5 — умовні кроки: якщо вони не використовуються, наказ з журналу 3 переходить одразу в журнал 6. До кроку 7 наказ із будь-якого журналу 2–6 можна повернути в журнал 1 (статус «Проект»); із журналів 5–6 — через «Відкликати» (Alt+R), у журналі 6 — до блокування Ctrl+L.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
    <marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <style>
      text { font-family: 'Segoe UI', Roboto, Arial, sans-serif; fill: #0f172a; }
      .h1 { font-size: 24px; font-weight: 700; }
      .sub { font-size: 13.5px; fill: #475569; }
      .name { font-size: 16px; font-weight: 700; }
      .own { font-size: 13px; font-weight: 600; }
      .li { font-size: 12.5px; }
      .rt { font-size: 11.5px; fill: #64748b; }
      .tl { text-anchor: middle; font-size: 12px; fill: #334155; }
      .ol { text-anchor: middle; font-size: 12px; fill: #c2410c; }
      .pill { text-anchor: middle; font-size: 11px; font-weight: 700; }
      .num { text-anchor: middle; font-size: 13px; font-weight: 700; fill: #ffffff; }
      .m { font-size: 12px; }
      .box { stroke-width: 1.6; }
      .hr { fill: #eff6ff; stroke: #1d4ed8; }
      .pl { fill: #f5f3ff; stroke: #6d28d9; }
      .rv { fill: #f0fdf4; stroke: #15803d; }
      .st { fill: #f8fafc; stroke: #94a3b8; stroke-dasharray: 5 4; }
      .flow { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#a); }
      .back { fill: none; stroke: #c2410c; stroke-width: 1.8; stroke-dasharray: 6 4; marker-end: url(#ao); }
      .div { stroke: #cbd5e1; stroke-width: 1; }
      .cond { stroke-dasharray: 8 5; }
      .skip { fill: none; stroke: #b45309; stroke-width: 1.8; stroke-dasharray: 3 4; marker-end: url(#ay); }
      .cl { font-size: 11px; font-weight: 700; fill: #92400e; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1600" height="962" fill="#ffffff"/>

  <!-- Зона повернення: кроки 2–6 -->
  <polygon points="450,142 1495,142 1495,755 815,755 815,395 450,395" fill="#fff7ed" fill-opacity="0.55" stroke="#c2410c" stroke-width="1.6" stroke-dasharray="8 5"/>
  <text x="462" y="134" class="ol" style="text-anchor:start; font-weight:700">Зона повернення: до кроку 7 наказ можна повернути в журнал 1 — статус знову «Проект», причина у вкладенні</text>

  <!-- Загальний блок умовних кроків 4–5 -->
  <rect x="1186" y="148" width="306" height="604" rx="14" fill="#fffbeb" fill-opacity="0.85" stroke="#b45309" stroke-width="1.8" stroke-dasharray="8 5"/>
  <rect x="1279" y="138" width="120" height="20" rx="10" fill="#fef3c7" stroke="#b45309"/><text x="1339" y="152" class="cl">умовні кроки 4–5</text>

  <!-- Заголовок -->
  <text x="60" y="38" class="h1">Цільовий маршрут наказу по журналах</text>
  <text x="60" y="62" class="sub">Журнал = чия зараз черга: наказ лежить у журналі того, хто має діяти. Статуси ISpro не змінюємо вручну — вони йдуть своїм ходом, етап показує журнал. Опис кроків — ispro-order-route-order.md.</text>

  <!-- 1 · Проєкти -->
  <rect x="90" y="160" width="280" height="220" rx="10" class="box hr"/>
  <circle cx="114" cy="186" r="13" fill="#1d4ed8"/><text x="114" y="191" class="num">1</text>
  <text x="134" y="192" class="name">Проєкти</text>
  <rect x="290" y="176" width="68" height="20" rx="10" fill="#bfdbfe"/><text x="324" y="190" class="pill" style="fill:#1e3a8a">Проект</text>
  <text x="104" y="218" class="own" style="fill:#1d4ed8">ВК · фахівець К1</text>
  <line x1="104" y1="230" x2="356" y2="230" class="div"/>
  <text class="li"><tspan x="104" y="252">• створення проєкту наказу</tspan><tspan x="104" y="272">• доопрацювання після повернення</tspan><tspan x="104" y="292">• виконавець і строк — «Контроль</tspan><tspan x="114" y="310">виконання наказу» (Alt+S)</tspan></text>
  <text x="104" y="364" class="rt">права: створення, коригування</text>

  <!-- 2 · Погодження ПВ -->
  <rect x="460" y="160" width="280" height="220" rx="10" class="box pl"/>
  <circle cx="484" cy="186" r="13" fill="#6d28d9"/><text x="484" y="191" class="num">2</text>
  <text x="504" y="192" class="name">Погодження ПВ</text>
  <rect x="660" y="176" width="68" height="20" rx="10" fill="#bfdbfe"/><text x="694" y="190" class="pill" style="fill:#1e3a8a">Проект</text>
  <text x="474" y="218" class="own" style="fill:#6d28d9">Плановий відділ</text>
  <line x1="474" y1="230" x2="726" y2="230" class="div"/>
  <text class="li"><tspan x="474" y="252">• віза: штатний розпис, фонди</tspan><tspan x="474" y="272">• погоджено → журнал 3</tspan><tspan x="474" y="292">• зауваження → повернення в 1</tspan></text>
  <text x="474" y="364" class="rt">права: перегляд, перенесення *</text>

  <!-- 3 · Погодження РВ -->
  <rect x="830" y="160" width="280" height="220" rx="10" class="box rv"/>
  <circle cx="854" cy="186" r="13" fill="#15803d"/><text x="854" y="191" class="num">3</text>
  <text x="874" y="192" class="name">Погодження РВ</text>
  <rect x="1030" y="176" width="68" height="20" rx="10" fill="#bfdbfe"/><text x="1064" y="190" class="pill" style="fill:#1e3a8a">Проект</text>
  <text x="844" y="218" class="own" style="fill:#15803d">Розрахунковий відділ</text>
  <line x1="844" y1="230" x2="1096" y2="230" class="div"/>
  <text class="li"><tspan x="844" y="252">• віза: надбавки, фонди, ЗП</tspan><tspan x="844" y="272">• погоджено → журнал 4</tspan><tspan x="844" y="292">• зауваження → повернення в 1</tspan></text>
  <text x="844" y="364" class="rt">права: перегляд, перенесення *</text>

  <!-- 4 · На підписі -->
  <rect x="1200" y="160" width="280" height="220" rx="10" class="box hr"/>
  <circle cx="1224" cy="186" r="13" fill="#1d4ed8"/><text x="1224" y="191" class="num">4</text>
  <text x="1244" y="192" class="name">На підписі</text>
  <rect x="1400" y="176" width="68" height="20" rx="10" fill="#bfdbfe"/><text x="1434" y="190" class="pill" style="fill:#1e3a8a">Проект</text>
  <text x="1214" y="218" class="own" style="fill:#1d4ed8">ВК · фахівець К1</text>
  <line x1="1214" y1="230" x2="1466" y2="230" class="div"/>
  <text class="li"><tspan x="1214" y="252">• тверда копія або КЕП</tspan><tspan x="1214" y="272">• підписант: ректор або</tspan><tspan x="1224" y="290">уповноважена особа</tspan><tspan x="1214" y="310">• не підписано → повернення в 1</tspan></text>
  <text x="1214" y="364" class="rt">права: перенесення *</text>

  <!-- 5 · Реєстрація -->
  <rect x="1200" y="520" width="280" height="220" rx="10" class="box hr"/>
  <circle cx="1224" cy="546" r="13" fill="#1d4ed8"/><text x="1224" y="551" class="num">5</text>
  <text x="1244" y="552" class="name">Реєстрація</text>
  <rect x="1372" y="536" width="96" height="20" rx="10" fill="#60a5fa"/><text x="1420" y="550" class="pill" style="fill:#ffffff">Затверджений</text>
  <text x="1214" y="578" class="own" style="fill:#1d4ed8">ВК · фахівець К2</text>
  <line x1="1214" y1="590" x2="1466" y2="590" class="div"/>
  <text class="li"><tspan x="1214" y="612">• Затвердити (Alt+F5): номер</tspan><tspan x="1224" y="630">і дата в день підпису</tspan><tspan x="1214" y="650">• Провести (Alt+P)</tspan><tspan x="1214" y="670">• ДПС — до першого робочого дня</tspan><tspan x="1214" y="690">• повернення: Відкликати (Alt+R)</tspan></text>
  <text x="1214" y="724" class="rt">права: реєстрація, проведення</text>

  <!-- 6 · Проведені -->
  <rect x="830" y="520" width="280" height="220" rx="10" class="box rv"/>
  <circle cx="854" cy="546" r="13" fill="#15803d"/><text x="854" y="551" class="num">6</text>
  <text x="874" y="552" class="name">Проведені</text>
  <rect x="1010" y="536" width="88" height="20" rx="10" fill="#2563eb"/><text x="1054" y="550" class="pill" style="fill:#ffffff">Проведений</text>
  <text x="844" y="578" class="own" style="fill:#15803d">Розрахунковий відділ</text>
  <line x1="844" y1="590" x2="1096" y2="590" class="div"/>
  <text class="li"><tspan x="844" y="612">• підтвердження наказів</tspan><tspan x="854" y="630">відділом зарплати (Alt+Н)</tspan><tspan x="844" y="650">• перевірка особового рахунку</tspan><tspan x="844" y="670">• Ctrl+L — блокування відкликання</tspan><tspan x="844" y="690">• до Ctrl+L: Відкликати (Alt+R)</tspan></text>
  <text x="844" y="724" class="rt">дії — в Обліку праці й ЗП</text>

  <!-- 7 · Чинні накази -->
  <rect x="460" y="520" width="280" height="220" rx="10" class="box hr"/>
  <circle cx="484" cy="546" r="13" fill="#1d4ed8"/><text x="484" y="551" class="num">7</text>
  <text x="504" y="552" class="name">Чинні накази</text>
  <rect x="640" y="536" width="88" height="20" rx="10" fill="#2563eb"/><text x="684" y="550" class="pill" style="fill:#ffffff">Проведений</text>
  <text x="474" y="578" class="own" style="fill:#1d4ed8">ВК · фахівець К2</text>
  <line x1="474" y1="590" x2="726" y2="590" class="div"/>
  <text class="li"><tspan x="474" y="612">• повністю затверджені й проведені</tspan><tspan x="474" y="630">• є паперовий примірник з підписом</tspan><tspan x="474" y="650">• скасувати не можна (Ctrl+L),</tspan><tspan x="484" y="668">зміни — лише новим наказом</tspan><tspan x="474" y="688">• ознайомлення працівника під</tspan><tspan x="484" y="706">підпис (ст. 29 КЗпП)</tspan></text>
  <text x="474" y="728" class="rt">права: перегляд, перенесення *</text>

  <!-- 8 · Архів -->
  <rect x="90" y="520" width="280" height="220" rx="10" class="box hr"/>
  <circle cx="114" cy="546" r="13" fill="#1d4ed8"/><text x="114" y="551" class="num">8</text>
  <text x="134" y="552" class="name">Архів</text>
  <rect x="270" y="536" width="88" height="20" rx="10" fill="#2563eb"/><text x="314" y="550" class="pill" style="fill:#ffffff">Проведений</text>
  <text x="104" y="578" class="own" style="fill:#1d4ed8">ВК · фахівець К2</text>
  <line x1="104" y1="590" x2="356" y2="590" class="div"/>
  <text class="li"><tspan x="104" y="612">• накази переходять сюди з</tspan><tspan x="114" y="630">журналу 7 через встановлений строк</tspan><tspan x="104" y="650">• паперові примірники — в архів</tspan><tspan x="114" y="668">паперових наказів</tspan><tspan x="104" y="688">• історія руху — «Протокол змін</tspan><tspan x="114" y="706">запису» (Shift+F10)</tspan></text>
  <text x="104" y="724" class="rt">права: перегляд</text>

  <!-- Рух вперед -->
  <path d="M370,270 L458,270" class="flow"/><text x="415" y="258" class="tl">на візу</text>
  <path d="M740,270 L828,270" class="flow"/><text x="785" y="258" class="tl">погоджено</text>
  <path d="M1110,270 L1198,270" class="flow"/><text x="1155" y="258" class="tl">погоджено</text>
  <path d="M1340,380 L1340,518" class="flow"/><text x="1352" y="455" class="tl" style="text-anchor:start">підписано</text>
  <path d="M1200,630 L1112,630" class="flow"/><text x="1155" y="618" class="tl">проведено</text>
  <path d="M830,630 L742,630" class="flow"/><text x="785" y="618" class="tl">підтверджено</text><text x="785" y="648" class="tl">Ctrl+L</text>
  <path d="M460,630 L372,630" class="flow"/><text x="415" y="618" class="tl">через строк</text>

  <!-- Повернення -->
  <path d="M450,205 L372,205" class="back"/>
  <text x="411" y="196" class="ol">в проєкт</text>

  <!-- Обхід умовних кроків 4–5 -->
  <path d="M1050,380 L1050,518" class="skip"/>
  <text x="1060" y="440" style="font-size:12px; fill:#92400e">якщо кроки 4–5</text>
  <text x="1060" y="456" style="font-size:12px; fill:#92400e">не використовуються</text>

  <!-- Налаштування ISpro -->
  <rect x="90" y="766" width="1390" height="96" rx="10" class="box st"/>
  <text x="104" y="792" class="name" style="font-size:15px">Налаштування ISpro</text>
  <text class="li" style="font-size:12px"><tspan x="104" y="818">• права за журналами: Облік кадрів → Керування доступом → Журнали</tspan><tspan x="104" y="840">• «Автонумерація наказів окремо для кожного журналу» — вимкнути</tspan></text>
  <text class="li" style="font-size:12px"><tspan x="760" y="818">• прив'язка видів наказів і підписів до журналів — прийом дозволений у всіх журналах 1–8</tspan><tspan x="760" y="840">• * як переносити наказ між журналами (можливо, Alt+D) — перевірити на інсталяції</tspan></text>

  <!-- Легенда -->
  <rect x="60" y="878" width="1480" height="70" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="80" y="894" width="20" height="14" rx="3" class="box hr"/><text x="108" y="906" class="m">Відділ кадрів</text>
  <rect x="230" y="894" width="20" height="14" rx="3" class="box pl"/><text x="258" y="906" class="m">Плановий відділ</text>
  <rect x="400" y="894" width="20" height="14" rx="3" class="box rv"/><text x="428" y="906" class="m">Розрахунковий відділ</text>
  <rect x="600" y="894" width="40" height="14" rx="7" fill="#bfdbfe"/><text x="648" y="906" class="m">статус наказу в ISpro (змінюється сам: Затвердити, Провести)</text>
  <rect x="1060" y="894" width="20" height="14" rx="3" fill="#fffbeb" stroke="#b45309" stroke-dasharray="4 3"/><text x="1088" y="906" class="m">умовні кроки</text>
  <path d="M1200,901 L1248,901" class="skip"/><text x="1258" y="906" class="m">обхід умовних кроків</text>
  <path d="M80,932 L128,932" class="flow"/><text x="138" y="936" class="m">перенесення в наступний журнал</text>
  <path d="M380,932 L428,932" class="back"/><text x="438" y="936" class="m">повернення в проєкт (журнал 1)</text>
  <rect x="1200" y="926" width="20" height="14" rx="3" fill="#fff7ed" stroke="#c2410c" stroke-dasharray="4 3"/><text x="1228" y="936" class="m">зона повернення (кроки 2–6)</text>
  <text x="680" y="936" class="m">* спосіб перенесення наказу між журналами треба перевірити на інсталяції</text>
</svg>
